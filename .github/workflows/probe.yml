name: probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node diag.mjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          JOOMLA_BASE: ${{ secrets.JOOMLA_BASE }}
          JOOMLA_TOKEN: ${{ secrets.JOOMLA_TOKEN }}
